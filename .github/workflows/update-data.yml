name: Update Syrian Lira Data

on:
  schedule:
    - cron: '0 * * * *'  # كل ساعة
  workflow_dispatch:  # يدوياً أيضاً

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4
        
    - name: Fetch data from sp-today.com
      run: |
        python update_sp_today.py
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add sp_today_data.json
        git diff --staged --quiet || git commit -m "Update data: $(date)"
        git push
