name: Update Currency Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # مهم للـ push
    
    steps:
      - uses: actions/checkout@v4  # أحدث إصدار
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
      
      - name: Run update script
        run: python update_sp_today.py
        continue-on-error: true  # لا يفشل إذا فشل السكريبت
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add sp_today_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 تحديث الأسعار - $(date '+%Y-%m-%d %H:%M')" && git push)
